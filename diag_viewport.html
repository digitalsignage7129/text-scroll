<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表示領域 診断ページ</title>
<style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111; color:#fff;
        font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",Meiryo,Arial,sans-serif; }
    /* 画面の四辺に色付きの太線（どの辺が見えているかで見切れを判定） */
    .edge { position:fixed; z-index:9; }
    .top    { left:0; top:0;    width:100%; height:10px; background:#e8501e; }
    .bottom { left:0; bottom:0; width:100%; height:10px; background:#2e9bff; }
    .left   { left:0; top:0;    width:10px; height:100%; background:#27c46b; }
    .right  { right:0; top:0;   width:10px; height:100%; background:#f2c14e; }
    .corner { position:fixed; z-index:10; font-size:13px; font-weight:800; background:#000; padding:2px 6px; }
    #ruler { position:absolute; left:0; top:0; z-index:5; }
    .tick { position:absolute; top:12px; width:1px; height:22px; background:#888; }
    .tick span { position:absolute; left:3px; top:0; font-size:12px; color:#ccc; white-space:nowrap; }
    .vtick { position:absolute; left:12px; height:1px; width:22px; background:#888; }
    .vtick span { position:absolute; left:24px; top:-7px; font-size:11px; color:#ccc; }
    #info { position:fixed; z-index:8; left:0; top:0; width:100%; height:100%; text-align:center; }
    #main { position:absolute; left:0; width:100%; top:50%; transform:translateY(-50%); -webkit-transform:translateY(-50%); }
    #size { font-size:58px; font-weight:800; color:#f2c14e; line-height:1.1; }
    .sm { font-size:20px; color:#ddd; line-height:1.5; }
    .box { position:absolute; left:0; top:0; width:1920px; height:212px; border:3px dashed #ff4d8d; box-sizing:border-box; z-index:6; }
    .box i { position:absolute; right:14px; bottom:4px; font-style:normal; font-size:14px; color:#ff4d8d; background:#000; padding:0 6px; }
</style>
</head>
<body>
    <div class="edge top"></div><div class="edge bottom"></div><div class="edge left"></div><div class="edge right"></div>
    <div class="corner" style="left:14px;top:14px;">左上</div>
    <div class="corner" style="right:14px;top:14px;">右上</div>
    <div class="corner" style="left:14px;bottom:14px;">左下</div>
    <div class="corner" style="right:14px;bottom:14px;">右下</div>

    <div id="ruler"></div>
    <div class="box"><i>1920 × 212 の枠（ピンクの点線）</i></div>

    <div id="info"><div id="main">
        <div id="size">--</div>
        <div class="sm" id="l2"></div>
        <div class="sm" id="l3"></div>
    </div></div>

<script>
    // 目盛り（横：100pxごと／縦：50pxごと）
    var ruler = document.getElementById('ruler');
    var i, el, sp;
    for (i = 0; i <= 3840; i += 100) {
        el = document.createElement('div'); el.className = 'tick'; el.style.left = i + 'px';
        sp = document.createElement('span'); sp.textContent = i; el.appendChild(sp); ruler.appendChild(el);
    }
    for (i = 50; i <= 1200; i += 50) {
        el = document.createElement('div'); el.className = 'vtick'; el.style.top = i + 'px';
        sp = document.createElement('span'); sp.textContent = i; el.appendChild(sp); ruler.appendChild(el);
    }

    function update() {
        var w = window.innerWidth, h = window.innerHeight;
        document.getElementById('size').textContent = '表示領域  ' + w + ' × ' + h;
        document.getElementById('l2').textContent =
            'devicePixelRatio ' + (window.devicePixelRatio || 1) + '　／　screen ' + screen.width + ' × ' + screen.height +
            '　／　clientWidth ' + document.documentElement.clientWidth;
        document.getElementById('l3').textContent = navigator.userAgent;
        // 小さい領域では文字を縮める
        var fs = Math.max(14, Math.min(58, Math.round(h * 0.26)));
        document.getElementById('size').style.fontSize = fs + 'px';
        var sm = Math.max(10, Math.min(20, Math.round(h * 0.09)));
        document.getElementById('l2').style.fontSize = sm + 'px';
        document.getElementById('l3').style.fontSize = Math.max(9, sm - 4) + 'px';
    }
    update();
    window.addEventListener('resize', update);
    window.addEventListener('load', update);
</script>
</body>
</html>
